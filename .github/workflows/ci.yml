name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify required submodules
        run: |
          set -euo pipefail
          git submodule status --recursive
          test -s libraries/kristal-i18n/lib.lua
          test -s libraries/kristal-i18n/lib.json
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y just jq love luajit libxml2-utils rsync unzip xvfb zip
      - name: Check Lua source and documentation
        run: make test
      - name: Build standalone packages
        run: ./build_standalone.sh
      - name: Build Mod package
        run: ./.github/scripts/build_mod.sh
      - name: Run Kristal smoke test
        run: KRISTAL="$PWD/.build/Kristal" make test-kristal
      - name: Verify release assets
        run: |
          set -euo pipefail
          files=(
            dist/kristal-i18n-example-release.love
            dist/kristal-i18n-example-debug.love
            dist/kristal-i18n-example-release-win64.zip
            dist/kristal-i18n-example-debug-win64.zip
            dist/kristal-i18n-example-mod.zip
          )
          for file in "${files[@]}"; do
            test -s "$file"
            unzip -t "$file" >/dev/null
          done
          unzip -Z1 dist/kristal-i18n-example-mod.zip | grep -Fx mod.json >/dev/null
          unzip -Z1 dist/kristal-i18n-example-mod.zip | grep '^libraries/kristal-i18n/' >/dev/null
          test -z "$(unzip -Z1 dist/kristal-i18n-example-mod.zip | grep '^build_standalone' || true)"
      - name: Generate and verify SHA-256 manifest
        run: |
          .github/scripts/generate_sha256sums.sh dist
          test "$(wc -l < dist/SHA256SUMS)" -eq 5
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: kristal-i18n-example-${{ github.sha }}
          path: dist/
          if-no-files-found: error
